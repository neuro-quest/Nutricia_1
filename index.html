<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEE7F2">
<title>НейроКвест — Nutricia</title>
<style>
  :root{
    --bg:#F7F3FC; --primary:#6D2E8C; --primary-d:#55217A; --soft:#EFE6F8; --line:#DDCBEE;
    --ink:#17141C; --muted:#6B6378; --card:#fff;
    --gold1:#FBE7AC; --gold2:#E2B443; --gold-ink:#6B4600;
    --silver1:#F4F5F9; --silver2:#C9CEDC; --silver-ink:#3B4252;
    --ok:#2E8B57; --err:#C0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .logo{height:46px;margin-bottom:12px;display:flex;align-items:center}
  .logo img{height:100%;width:auto}
  .logo .ph{height:46px;padding:0 14px;border:1.5px dashed #9B7FB0;border-radius:8px;
    display:flex;align-items:center;font-size:12px;color:#7A5F8E}
  /* прогресс */
  .score{margin-bottom:16px}
  .score-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
  .score-top b{font-size:24px;color:var(--primary)}
  .bar{position:relative;height:10px;background:#fff;border-radius:6px}
  .bar-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;
    background:linear-gradient(90deg,var(--primary),#B455B0);transition:width .5s}
  .mark{position:absolute;top:-4px;width:2px;height:18px;background:var(--primary-d)}
  .mark-l{position:absolute;top:16px;display:flex;align-items:center;gap:4px;
    font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
  .mark-l.end{transform:translateX(-100%)}
  .mark-l svg{width:17px;height:17px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mark-l.silver svg{stroke:#8E95A8} .mark-l.silver.got{stroke:#5E6678;color:#5E6678}
  .mark-l.gold svg{stroke:#D3A43A} .mark-l.gold.got{stroke:#B98A1E;color:#8A6400}
  .marks{height:24px}
  main{flex:1;display:flex;flex-direction:column}
  h1{font-size:19px;margin:0 0 14px}
  h2{font-size:17px;margin:0 0 10px}
  p{font-size:16px;line-height:1.45;margin:0 0 14px}
  .small{font-size:13px;color:var(--muted);line-height:1.35}
  ol{padding-left:22px;margin:0 0 14px;font-size:16px;line-height:1.45}
  ol li{margin-bottom:6px}
  .spacer{flex:1;min-height:16px}
  .badge{align-self:flex-end;order:-1;margin:0 0 4px 12px;background:var(--primary);color:#fff;border-radius:16px;
    padding:8px 14px;font-weight:700;font-size:16px;text-align:center;line-height:1.15;white-space:nowrap}
  .badge.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink)}
  .btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:18px;padding:17px;font-size:19px;
    background:#fff;color:var(--primary-d);font-family:inherit;cursor:pointer;margin-top:10px;font-weight:600}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#9B40A6);border-color:transparent;
    color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(109,46,140,.28)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:10px}
  .input{width:100%;border:0;border-radius:18px;background:#fff;padding:22px 18px;font-size:17px;
    font-family:inherit;color:var(--ink);margin:4px 0}
  textarea.input{min-height:130px;resize:vertical;line-height:1.4}
  .msg{font-size:14px;margin:8px 2px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  /* задания */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border:0;border-radius:20px;padding:14px;text-align:left;font-family:inherit;
    color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:148px;position:relative}
  .card .ico{width:40px;height:40px;border-radius:12px;background:var(--soft);
    display:flex;align-items:center;justify-content:center}
  .card .ico svg{width:24px;height:24px;stroke:var(--primary-d);fill:none;stroke-width:1.8;stroke-linecap:round}
  .card .t{font-weight:700;font-size:15px;line-height:1.2}
  .card .st{font-size:12px;color:var(--muted);margin-top:auto}
  .pts{position:absolute;top:12px;right:12px;background:var(--primary);color:#fff;font-weight:700;
    font-size:13px;border-radius:12px;padding:4px 9px}
  .card.done{opacity:.62}
  .card.done .pts{background:var(--ok)}
  .card.gold{grid-column:1/-1;min-height:166px;
    background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 6px 20px rgba(227,178,60,.5)}
  .card.gold .ico{background:rgba(255,255,255,.6)} .card.gold .ico svg{stroke:var(--gold-ink)}
  .card.gold .pts{background:var(--gold-ink);font-size:15px}
  .card.gold .st{color:#5A3A00;font-weight:600;font-size:13px}
  .card .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold-ink)}
  .card.gold.live{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(227,178,60,.5)}50%{box-shadow:0 6px 32px rgba(227,178,60,.95)}}
  .card.closed{filter:grayscale(1);opacity:.55}
  .prizebox{background:#fff;border-radius:20px;padding:16px;margin-top:14px;display:flex;gap:12px;align-items:center}
  .prizebox svg{width:34px;height:34px;flex:none;stroke:var(--primary);fill:none;stroke-width:1.8;stroke-linecap:round}
  .prizebox.win{background:linear-gradient(135deg,var(--gold1),var(--gold2))}
  .prizebox.win svg{stroke:var(--gold-ink)}
  .pid{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #fff;border-radius:18px;
    padding:16px;font-size:16px;font-family:inherit;color:inherit;cursor:pointer;margin-bottom:10px;line-height:1.35}
  .opt.sel{border-color:var(--primary)}
  /* плашки призов */
  .tile{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;margin-bottom:12px}
  .tile .ic{width:48px;height:48px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.55)}
  .tile .ic svg{width:28px;height:28px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile .n{font-size:13px;font-weight:800;letter-spacing:.06em;opacity:.85}
  .tile .v{font-size:17px;font-weight:700;line-height:1.2}
  .tile.silver{background:linear-gradient(135deg,var(--silver1),var(--silver2));color:var(--silver-ink);
    box-shadow:0 4px 14px rgba(120,130,160,.25)}
  .tile.silver .ic svg{stroke:var(--silver-ink)}
  .tile.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink);
    box-shadow:0 6px 18px rgba(226,180,67,.45)}
  .tile.gold .ic svg{stroke:var(--gold-ink)}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ok);color:#fff;
    border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   НАСТРОЙКИ — здесь меняются ссылки, кодовые слова, баллы и время
   =================================================================== */
const CONFIG = {

  // Ссылка на анкету (Яндекс Форма). Можно заменить в любой момент.
  formUrl: 'https://forms.yandex.ru/cloud/6aabe082f47e73091f9bdbba',
  // Имя скрытого вопроса в форме, куда подставляется ID участника.
  formPidParam: 'pid',

  // Адрес Google Apps Script для отзывов и статистики.
  // Пока пусто — приложение работает, данные копятся в браузере и уйдут после заполнения.
  endpoint: 'https://script.google.com/macros/s/AKfycbxV5kqbxSKLDDgFfZ57X-NfYO7RYHWrjDf5Ydh_3bgrFEldi1guhpDuwlK4KskHy1c9fw/exec',

  // Кодовые слова. Регистр, пробелы и раскладка не важны.
  codes: {
    anketa: ['Nutridrink'],       // слово из сообщения после анкеты
    symposium: ['восстановление'] // слово с финального слайда симпозиума
  },

  // Баллы
  points: { anketa: 10, quiz: 15, symposium: 30, review: 15 },

  // Призы
  prizes: [
    { score: 40, name: 'фирменный картхолдер' },
    { score: 70, name: 'картхолдер + обложка на документы' }
  ],

  // Окно приёма кодового слова симпозиума (время московское)
  symposium: {
    // false — слово принимается всегда (для проверки).
    // ПЕРЕД КОНГРЕССОМ поставить true, чтобы работало окно ниже.
    checkTime: false,
    start: '2026-10-09T13:15:00+03:00',
    end:   '2026-10-09T16:00:00+03:00',
    closedText: 'К сожалению, симпозиум уже завершился, но вы можете узнать больше о нутритивной поддержке на стенде Nutricia.'
  },

  // Квиз. correct — номер правильного ответа, считая с нуля.
  quiz: [
    { n: 1,
      q: 'Сколько вкусов в линейке Nutridrink 200 мл?',
      options: ['<b>4</b> - банан, клубника, ваниль и шоколад',
                '<b>3</b> - банан, клубника, ваниль',
                '<b>2</b> - банан и ваниль'],
      correct: 0 },                       // ПРОВЕРИТЬ
    { n: 2,
      q: 'Клинически доказано: применение Nutridrink 200 мл способствует снижению частоты инвалидизации...',
      options: ['в <b>1,5</b> раза', 'в <b>2</b> раза', 'в <b>4</b> раза'],
      correct: 1 },                       // ПРОВЕРИТЬ
    { n: 3,
      q: 'Клинически доказано: применение Nutridrink 200 мл способствует достижению независимости в быту:',
      options: ['<b>3%</b> пациентов, получавших Nutridrink 200 мл, были независимы в быту к 90-му дню',
                '<b>7%</b> пациентов, получавших Nutridrink 200 мл, были независимы в быту к 90-му дню',
                '<b>37%</b> пациентов, получавших Nutridrink 200 мл, были независимы в быту к 90-му дню'],
      correct: 2 }
  ],

  // Логотип: положите файл logo.png рядом с index.html. Пока его нет — показывается рамка.
  logo: 'logo.png'
};
/* =================== конец настроек =================== */

const MAX = CONFIG.points.anketa + CONFIG.points.quiz + CONFIG.points.symposium + CONFIG.points.review;
const HINT = 'Регистр букв, пробелы и раскладка клавиатуры не важны.';
const QUIZ_HINT = 'Подсказки для вас мы оставили на стенде Nutricia в выставочной зоне.<br>Загляните туда и наши эксперты с удовольствием помогут вам!';
const norm = s => (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
/* раскладка клавиатуры: «Nutridrink», набранное по-русски, тоже засчитывается */
const RU = 'йцукенгшщзхъфывапролджэячсмитьбю', EN = 'qwertyuiop[]asdfghjkl;\'zxcvbnm,.';
const swap = (s, from, to) => s.split('').map(c => {
  const i = from.indexOf(c); return i >= 0 ? to[i] : c;
}).join('');
function variants(s){
  const n = norm(s);
  return [n, norm(swap(n, RU, EN)), norm(swap(n, EN, RU))];
}

/* ---------- сохранение прогресса ---------- */
const KEY = 'neuroquest2026';
let S;
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)) } catch(e){ S = null }
  if (!S || !S.pid) {
    S = { pid: (Date.now().toString(36) + Math.random().toString(36).slice(2,6)).toUpperCase(),
          started: new Date().toISOString(), screen:'welcome',
          done:{anketa:false,quiz:false,symposium:false,review:false},
          quizSel:{}, review:'', prizes:[] };
    save();
  }
  S.msg=''; S.msgType='';
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)) } catch(e){} }
const score = () => Object.keys(S.done).reduce((a,k)=>a + (S.done[k] ? CONFIG.points[k] : 0), 0);

/* ---------- статистика и отзывы ---------- */
const QKEY = 'neuroquest2026_queue';
function queue(){ try { return JSON.parse(localStorage.getItem(QKEY)) || [] } catch(e){ return [] } }
function track(event, extra){
  const row = Object.assign({ pid:S.pid, event, score:score(), ts:new Date().toISOString() }, extra||{});
  const q = queue(); q.push(row);
  try { localStorage.setItem(QKEY, JSON.stringify(q)) } catch(e){}
  flush();
}
function flush(){
  if (!CONFIG.endpoint) return;
  const q = queue(); if (!q.length) return;
  try { localStorage.setItem(QKEY, '[]') } catch(e){}
  fetch(CONFIG.endpoint, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({rows:q}) })
    .catch(() => { // не ушло — вернём в очередь
      try { localStorage.setItem(QKEY, JSON.stringify(q.concat(queue()))) } catch(e){}
    });
}
window.addEventListener('online', flush);

/* ---------- время ---------- */
const now = () => new Date();
const SYMP = { start: new Date(CONFIG.symposium.start), end: new Date(CONFIG.symposium.end) };
function sympState(){
  if (!CONFIG.symposium.checkTime) return 'live';
  const n = now();
  if (n < SYMP.start) return 'soon';
  if (n <= SYMP.end)  return 'live';
  return 'closed';
}
function left(ms){
  const m = Math.round(ms/60000), h = Math.floor(m/60), mm = m%60;
  if (m > 1440) return null;
  return h ? h + ' ч ' + mm + ' мин' : mm + ' мин';
}

/* ---------- иконки ---------- */
const I = {
  mic:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 9h6M7 12h10"/></svg>',
  quiz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
  cup:'<svg viewBox="0 0 24 24"><path d="M7 3h10l-1.5 17a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z"/><path d="M7.5 9h9"/></svg>',
  gift:'<svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 14.5h5"/></svg>'
};

/* ---------- куски разметки ---------- */
function logo(){
  return '<div class="logo"><img src="' + CONFIG.logo + '" alt="Nutridrink" ' +
    'onerror="this.outerHTML=\'<span class=&quot;ph&quot;>логотип Nutridrink</span>\'"></div>';
}
function progress(){
  const sc = score(), p1 = CONFIG.prizes[0].score, p2 = CONFIG.prizes[1].score;
  return '<div class="score">' +
    '<div class="score-top"><span>Ваши баллы</span><span><b>' + sc + '</b> / ' + MAX + '</span></div>' +
    '<div class="bar"><div class="bar-fill" style="width:' + (sc/MAX*100) + '%"></div>' +
      '<div class="mark" style="left:' + (p1/MAX*100) + '%"></div>' +
      '<div class="mark-l silver' + (sc >= p1 ? ' got' : '') + '" style="left:' + (p1/MAX*100) + '%">' +
        I.gift + '<span>' + p1 + '</span></div>' +
      '<div class="mark-l gold end' + (sc >= p2 ? ' got' : '') + '" style="left:100%">' +
        I.gift + '<span>' + p2 + '</span></div>' +
    '</div><div class="marks"></div></div>';
}
const home = '<button class="btn" onclick="go(\'hub\')">На главную</button>';

/* ---------- экраны ---------- */
const screens = {

welcome: () => logo() + '<main>' +
  '<p>Уважаемый коллега!</p>' +
  '<p>Команда <b>Nutricia</b> рада приветствовать вас на “Нейроконгрессе-2026”.</p>' +
  '<p>Пройдите НейроКвест и узнайте, почему нутритивная терапия - неотъемлемый компонент восстановления после инсульта.</p>' +
  '<p><b>Как играть:</b></p>' +
  '<ol><li>в течение дня выполните <b>задания</b></li>' +
  '<li>каждое выполненное задание принесет вам <b>призовые баллы</b></li>' +
  '<li>обменяйте баллы на <b>призы на стенде Nutricia</b></li>' +
  '<li>каждый участник получит электронную версию <b>Справочника по продуктам Nutricia.</b></li></ol>' +
  '<div class="tile silver"><span class="ic">' + I.card + '</span>' +
    '<span><span class="n">' + CONFIG.prizes[0].score + ' БАЛЛОВ</span>' +
    '<div class="v">' + CONFIG.prizes[0].name + '</div></span></div>' +
  '<div class="tile gold"><span class="ic">' + I.gift + '</span>' +
    '<span><span class="n">' + CONFIG.prizes[1].score + ' БАЛЛОВ</span>' +
    '<div class="v">' + CONFIG.prizes[1].name + '</div></span></div>' +
  '<div class="spacer"></div>' +
  '<button class="btn" onclick="start()">Начать игру!</button></main>',

anketa: () => logo() + progress() + '<main>' +
  '<span class="badge">' + CONFIG.points.anketa + '<br>баллов</span>' +
  '<h2>Разминка. Знакомство</h2>' +
  '<p>Пожалуйста, ответьте на несколько вопросов анкеты.<br>' +
  'После отправки анкеты вы увидите кодовое слово.<br>' +
  'Анкета открывает остальные задания.</p>' +
  '<button class="btn primary" onclick="openForm()">Заполнить анкету</button>' +
  '<div class="spacer"></div>' +
  '<input class="input" id="code" placeholder="Введите кодовое слово" autocomplete="off" autocapitalize="off">' +
  '<div class="small">' + HINT + '</div>' +
  '<div class="msg ' + S.msgType + '">' + S.msg + '</div>' +
  '<button class="btn" onclick="checkCode(\'anketa\')">Далее</button></main>',

hub: () => {
  const st = sympState();
  let sympSt, sympCls = 'card gold';
  if (S.done.symposium) { sympSt = '✓ Выполнено'; sympCls += ' done'; }
  else if (!CONFIG.symposium.checkTime) { sympSt = '09 октября (пт) · 13:15–15:45 · зал «Пушкин»'; }
  else if (st === 'soon') {
    const l = left(SYMP.start - now());
    sympSt = l ? '⏳ Начнётся через ' + l + ' · зал «Пушкин»' : '09 октября (пт) · 13:15–15:45 · зал «Пушкин»';
  }
  else if (st === 'live') { sympSt = '🔴 Идёт сейчас · зал «Пушкин»'; sympCls += ' live'; }
  else { sympSt = 'Время вышло'; sympCls += ' closed'; }

  const card = (key, cls, ico, title, st2, tag) =>
    '<button class="' + cls + (S.done[key] && cls.indexOf('done') < 0 ? ' done' : '') + '" onclick="go(\'' + key + '\')">' +
    '<span class="pts">' + (S.done[key] ? '✓ ' : '+') + CONFIG.points[key] + '</span>' +
    (tag ? '<span class="tag">' + tag + '</span>' : '') +
    '<span class="ico">' + ico + '</span><span class="t">' + title + '</span>' +
    '<span class="st">' + st2 + '</span></button>';

  const sc = score(), p1 = CONFIG.prizes[0], p2 = CONFIG.prizes[1];
  let prize;
  if (sc >= p2.score) prize = '<div class="prizebox win">' + I.gift +
      '<div><b>Ваш приз: ' + p2.name + '</b><div class="small">Покажите этот экран сотруднику на стенде Nutricia</div></div></div>';
  else if (sc >= p1.score) prize = '<div class="prizebox win">' + I.gift +
      '<div><b>Ваш приз: ' + p1.name + '</b><div class="small">До следующего приза (' + p2.name + ') — ' + (p2.score - sc) + ' баллов</div></div></div>';
  else prize = '<div class="prizebox">' + I.gift +
      '<div><b>До приза «' + p1.name + '» — ' + (p1.score - sc) + ' баллов</b><div class="small">Задания можно выполнять в любом порядке</div></div></div>';

  return logo() + progress() + '<main><div class="grid">' +
    card('symposium', sympCls, I.mic, 'Посетите симпозиум Nutricia', sympSt, '★ СУПЕР-ЗАДАНИЕ') +
    card('quiz', 'card', I.quiz, 'Квиз о продуктах', S.done.quiz ? 'Выполнено' : 'Подсказки — на стенде') +
    card('review', 'card', I.cup, 'Поделитесь мнением', S.done.review ? 'Выполнено' : 'Стенд Nutricia') +
    '</div>' + prize +
    '<div class="pid">ID участника: ' + S.pid + '</div><div class="spacer"></div></main>';
},

/* --- квиз --- */
quiz: () => logo() + progress() + '<main>' +
  '<span class="badge">' + CONFIG.points.quiz + '<br>баллов</span>' +
  '<h2>Квиз о продуктах</h2>' +
  (S.done.quiz
    ? '<p class="msg ok">✓ Квиз пройден. Вам зачислено ' + CONFIG.points.quiz + ' призовых баллов.</p>'
    : '<p>Время квиза!<br>Предлагаем вам ответить на несколько вопросов.</p>' +
      '<p>Подсказки для вас мы оставили на стенде Nutricia в выставочной зоне.</p>' +
      '<p>Загляните туда и наши эксперты с удовольствием помогут вам узнать больше о нутритивной поддержке и ее роли в реабилитации после инсульта.</p>') +
  '<div class="spacer"></div>' +
  (S.done.quiz ? home
    : '<div class="row">' + home + '<button class="btn" onclick="go(\'q0\')">Далее</button></div>') +
  '</main>',

quizOk: () => logo() + progress() + '<main><h2>Квиз о продуктах</h2>' +
  '<p>Вы блестяще справились с вопросами!</p>' +
  '<p>Вам зачислено <b>' + CONFIG.points.quiz + ' призовых баллов.</b></p>' +
  '<div class="spacer"></div>' + home + '</main>',

quizFail: () => logo() + progress() + '<main><h2>Квиз о продуктах</h2>' +
  '<p>Похоже, один из ответов был выбран неверно.</p>' +
  '<p>Попробуйте еще раз. Вы можете воспользоваться помощью наших экспертов на стенде!</p>' +
  '<div class="spacer"></div>' +
  '<button class="btn" onclick="go(\'q0\')">Вернуться к вопросам</button>' + home + '</main>',

/* --- симпозиум --- */
symposium: () => {
  const st = sympState();
  if (S.done.symposium) return logo() + progress() + '<main><h2>Супер!</h2>' +
    '<p>Спасибо, что посетили симпозиум Nutricia!</p>' +
    '<p>Вам зачислено <b>' + CONFIG.points.symposium + ' призовых баллов.</b></p>' +
    '<div class="spacer"></div>' + home + '</main>';
  if (st === 'closed') return logo() + progress() + '<main>' +
    '<h2>Посетите симпозиум Nutricia</h2><p>' + CONFIG.symposium.closedText + '</p>' +
    '<div class="spacer"></div>' + home + '</main>';
  return logo() + progress() + '<main>' +
    '<span class="badge gold">' + CONFIG.points.symposium + '<br>баллов</span>' +
    '<h2>Посетите симпозиум Nutricia</h2>' +
    '<p><b>«Нутритивная терапия как базис успешной реабилитации после инсульта: от клинических рекомендаций к экономической эффективности»</b></p>' +
    '<p>09 октября (пт)<br><b>13:15-15:45</b><br>Зал «Пушкин»</p>' +
    '<p>Кодовое слово появится на одном из финальных слайдов, следите внимательно!</p>' +
    '<div class="spacer"></div>' +
    '<div class="row">' + home + '<button class="btn" onclick="go(\'sympCode\')">Далее</button></div></main>';
},

sympCode: () => {
  const st = sympState();
  return logo() + progress() + '<main><h2>Посетите симпозиум Nutricia</h2>' +
    (st === 'soon'
      ? '<p class="small">Кодовое слово можно будет ввести с 13:15.</p>'
      : '') +
    '<input class="input" id="code" placeholder="Введите Кодовое слово...." autocomplete="off" autocapitalize="off"' +
      (st === 'soon' ? ' disabled' : '') + '>' +
    '<div class="small">' + HINT + '</div>' +
    '<div class="msg ' + S.msgType + '">' + S.msg + '</div>' +
    (st === 'live' ? '<button class="btn primary" onclick="checkCode(\'symposium\')">Получить баллы</button>' : '') +
    '<div class="spacer"></div>' + home + '</main>';
},

/* --- отзыв --- */
review: () => logo() + progress() + '<main>' +
  '<span class="badge">' + CONFIG.points.review + '<br>баллов</span>' +
  '<h2>Поделитесь мнением</h2>' +
  (S.done.review
    ? '<p class="msg ok">✓ Спасибо, отзыв сохранён. Вам зачислено ' + CONFIG.points.review + ' призовых баллов.</p>'
    : '<p>Мы ждем вас на стенде Nutricia!<br>Попробуйте продукты лечебного питания Nutricia и оставьте свой отзыв — нам важно ваше мнение!</p>') +
  '<div class="spacer"></div>' +
  (S.done.review ? home
    : '<div class="row">' + home + '<button class="btn" onclick="go(\'reviewForm\')">Далее</button></div>') +
  '</main>',

reviewForm: () => logo() + progress() + '<main><h2>Поделитесь мнением</h2>' +
  '<textarea class="input" id="rev" placeholder="Какой продукт вы попробовали?&#10;Расскажите о ваших впечатлениях!">' + (S.review || '') + '</textarea>' +
  '<div class="msg ' + S.msgType + '">' + S.msg + '</div>' +
  '<div class="spacer"></div>' +
  '<div class="row">' + home + '<button class="btn primary" onclick="sendReview()">Далее</button></div></main>',

reviewOk: () => logo() + progress() + '<main><h2>Супер!</h2>' +
  '<p>Спасибо, что поделились мнением о продуктах Nutricia!</p>' +
  '<p>Вам зачислено <b>' + CONFIG.points.review + ' призовых баллов.</b></p>' +
  '<div class="spacer"></div>' + home + '</main>'
};

/* вопросы квиза — экраны q0, q1, q2 */
CONFIG.quiz.forEach((q, i) => {
  screens['q' + i] = () => logo() + progress() + '<main>' +
    '<h2>Вопрос №' + q.n + '</h2><p>' + q.q + '</p>' +
    q.options.map((o, j) =>
      '<button class="opt ' + (S.quizSel[i] === j ? 'sel' : '') + '" onclick="pick(' + i + ',' + j + ')">' + o + '</button>').join('') +
    '<div class="msg ' + S.msgType + '">' + S.msg + '</div>' +
    '<div class="spacer"></div><div class="small">' + QUIZ_HINT + '</div>' +
    '<div class="row">' + home +
    '<button class="btn" onclick="nextQ(' + i + ')">Далее</button></div></main>';
});

/* ---------- действия ---------- */
function render(){
  if (!screens[S.screen]) S.screen = 'welcome';
  document.getElementById('app').innerHTML = screens[S.screen]();
  window.scrollTo(0,0);
}
function go(s){
  if (s !== 'welcome' && s !== 'anketa' && !S.done.anketa) s = 'anketa';
  S.screen = s; S.msg = ''; S.msgType = ''; save();
  if (['quiz','symposium','review','hub'].indexOf(s) >= 0) track(s === 'hub' ? 'hub' : 'open_' + s);
  render();
}
function start(){ track('start'); go('anketa'); }
function say(t, type){ S.msg = t; S.msgType = type; }
function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
function openForm(){
  track('open_form');
  const u = CONFIG.formUrl + (CONFIG.formUrl.indexOf('?') >= 0 ? '&' : '?') + CONFIG.formPidParam + '=' + S.pid;
  window.open(u, '_blank', 'noopener');
}
function checkCode(key){
  const vs = variants(document.getElementById('code').value);
  if (!vs[0]) { say('Введите кодовое слово', 'err'); return render(); }
  if (key === 'symposium' && sympState() !== 'live') return render();
  const ok = CONFIG.codes[key].map(norm).some(c => vs.indexOf(c) >= 0);
  if (ok) {
    S.done[key] = true; save();
    track('done_' + key);
    checkPrize();
    toast('+' + CONFIG.points[key] + ' баллов');
    return go(key === 'anketa' ? 'hub' : 'symposium');
  }
  track('wrong_' + key);
  say('Слово не подошло. Проверьте написание и попробуйте ещё раз.', 'err');
  render();
}
function pick(i, j){ S.quizSel[i] = j; save(); say('', ''); render(); }
function nextQ(i){
  if (S.quizSel[i] === undefined) { say('Выберите вариант ответа', 'err'); return render(); }
  track('quiz_q' + (i+1));
  if (i < CONFIG.quiz.length - 1) return go('q' + (i+1));
  const ok = CONFIG.quiz.every((q, k) => S.quizSel[k] === q.correct);
  if (ok) {
    S.done.quiz = true; save(); track('done_quiz'); checkPrize();
    toast('+' + CONFIG.points.quiz + ' баллов');
    return go('quizOk');
  }
  track('quiz_fail'); S.quizSel = {}; save(); go('quizFail');
}
function sendReview(){
  const t = document.getElementById('rev').value.trim();
  S.review = t; save();
  if (t.length < 3) { say('Напишите, пожалуйста, несколько слов', 'err'); return render(); }
  S.done.review = true; save();
  track('done_review', { review: t });
  checkPrize();
  toast('+' + CONFIG.points.review + ' баллов');
  go('reviewOk');
}
function checkPrize(){
  const sc = score();
  CONFIG.prizes.forEach(p => {
    if (sc >= p.score && S.prizes.indexOf(p.score) < 0) {
      S.prizes.push(p.score); save(); track('prize_' + p.score);
      if (p.score === CONFIG.prizes[CONFIG.prizes.length-1].score) track('finish');
    }
  });
}

/* ---------- старт ---------- */
load();
track('open');
render();
</script>
</body>
</html>
