<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Формула Восстановления — набросок</title>
<style>
  :root{
    --bg:#EEE7F2; --page:#E4DCEA; --primary:#A4528F; --primary-d:#8A3F77;
    --soft:#E2CCDF; --ink:#141414; --muted:#6B6170; --card:#fff;
    --gold1:#FFE8A3; --gold2:#F2C14E; --gold3:#C98A12;
    --silver1:#F3F3F8; --silver2:#C9CAD6;
    --ok:#2E8B57; --err:#C0392B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);}
  .wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px 16px;flex-wrap:wrap}
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);border-radius:36px;box-shadow:0 10px 40px rgba(80,40,90,.18);padding:28px 18px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .logo{height:44px;width:128px;border:1.5px dashed #9b7fb0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#7a5f8e;margin-bottom:18px}
  /* score bar */
  .score{margin-bottom:18px}
  .score-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
  .score-top b{font-size:22px;color:var(--primary)}
  .bar{position:relative;height:10px;background:#fff;border-radius:6px}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--primary),#C98BB9);transition:width .5s}
  .mark{position:absolute;top:-4px;width:2px;height:18px;background:var(--primary-d)}
  .mark-l{position:absolute;top:18px;font-size:10px;color:var(--muted);transform:translateX(calc(-100% - 6px));white-space:nowrap}
  .mark-l.end{transform:translateX(-100%)}
  .content{flex:1;display:flex;flex-direction:column}
  h2{font-size:17px;margin:6px 0 10px}
  p{font-size:15px;line-height:1.4;margin:0 0 12px}
  .small{font-size:12px;color:var(--muted)}
  ol{padding-left:20px;margin:0 0 12px;font-size:15px;line-height:1.4}
  .btn{display:block;width:100%;border:0;border-radius:20px;padding:20px;font-size:22px;background:var(--soft);color:var(--ink);cursor:pointer;margin-top:12px;font-family:inherit}
  .btn.primary{background:var(--primary);color:#fff;font-weight:700;font-size:20px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.link{background:none;font-size:15px;padding:10px;color:var(--primary-d)}
  .spacer{flex:1}
  .input{width:100%;border:0;border-radius:18px;background:#fff;padding:22px 18px;font-size:17px;font-family:inherit;margin:6px 0}
  textarea.input{min-height:100px;resize:vertical}
  .msg{font-size:14px;margin:6px 2px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  /* hub cards */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border-radius:20px;padding:14px;cursor:pointer;position:relative;border:0;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s}
  .card:active{transform:scale(.98)}
  .card .ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .card .ico svg{width:24px;height:24px;stroke:var(--primary-d)}
  .card .t{font-weight:700;font-size:15px;line-height:1.2}
  .card .st{font-size:12px;color:var(--muted);margin-top:auto}
  .pts{position:absolute;top:12px;right:12px;background:var(--primary);color:#fff;font-weight:700;font-size:13px;border-radius:12px;padding:4px 9px}
  .card.done{opacity:.6}
  .card.done .pts{background:var(--ok)}
  .card.closed{filter:grayscale(1);opacity:.55}
  .card.gold{grid-column:1/-1;min-height:170px;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:0 6px 22px rgba(201,138,18,.45)}
  .card.gold .ico{background:rgba(255,255,255,.55)} .card.gold .ico svg{stroke:#7a4f00}
  .card.gold .pts{background:#7a4f00;font-size:16px;padding:6px 12px}
  .card.gold .st{color:#5a3a00;font-weight:600;font-size:13px}
  .card.gold .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#7a4f00}
  .card.gold.live{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 22px rgba(201,138,18,.45)}50%{box-shadow:0 6px 34px rgba(201,138,18,.95)}}
  .card.silver{background:linear-gradient(135deg,var(--silver1),var(--silver2))}
  .card.silver .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#55566a}
  .card.silver.live{animation:pulse2 1.6s infinite}
  @keyframes pulse2{0%,100%{box-shadow:0 0 0 rgba(120,120,150,0)}50%{box-shadow:0 0 22px rgba(120,120,150,.8)}}
  .prizebox{background:#fff;border-radius:20px;padding:16px;margin-top:14px;display:flex;gap:12px;align-items:center}
  .prizebox svg{width:36px;height:36px;stroke:var(--primary);flex:none}
  .pid{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
  .q{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px}
  .q .qt{font-weight:600;font-size:14px;margin-bottom:8px}
  .opt{display:inline-block;border:1.5px solid var(--soft);border-radius:12px;padding:8px 12px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;background:#fff;font-family:inherit}
  .opt.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
  .opt.wrong{border-color:var(--err)}
  .stars button{font-size:30px;background:none;border:0;cursor:pointer;color:#ccc;padding:0 2px}
  .stars button.on{color:var(--gold2)}
  .back{background:none;border:0;color:var(--primary-d);font-size:15px;padding:0;margin-bottom:10px;cursor:pointer;font-family:inherit;text-align:left}
  .hero{border-radius:20px;padding:16px;margin-bottom:14px}
  .hero.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2))}
  .hero.silver{background:linear-gradient(135deg,var(--silver1),var(--silver2))}
  .modal{position:absolute;inset:0;background:rgba(30,10,40,.45);display:flex;align-items:flex-end}
  .sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px}
  .mock-form{border:1.5px dashed #bbb;border-radius:12px;padding:14px;font-size:13px;color:#555;margin:10px 0}
  .toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  /* demo panel */
  .panel{width:300px;max-width:100%;background:#fff;border-radius:18px;padding:16px;font-size:13px;line-height:1.4}
  .panel h3{margin:0 0 8px;font-size:15px}
  .panel button{display:block;width:100%;margin:5px 0;padding:8px;border-radius:10px;border:1px solid #ddd;background:#faf7fb;cursor:pointer;font-family:inherit;font-size:13px;text-align:left}
  .panel button.cur{background:var(--primary);color:#fff;border-color:var(--primary)}
  .panel code{background:#f3eef5;padding:1px 5px;border-radius:5px}
  .panel hr{border:0;border-top:1px solid #eee;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone"></div>

  <div class="panel">
    <h3>Демо: время на конгрессе</h3>
    <div class="small" style="margin-bottom:6px">Только для просмотра наброска — в приложении этой панели нет.</div>
    <div id="timeBtns"></div>
    <div id="nowLbl" class="small" style="margin-top:6px"></div>
    <hr>
    <h3>Кодовые слова (демо)</h3>
    Анкета: <code>формула</code><br>
    Симпозиум: <code>центрис</code><br>
    Мастер-класс: <code>Nutilis</code> / <code>нутилис</code><br>
    PIN сотрудника: <code>1234</code><br>
    Квиз: 12 г · 300 ккал · 13
    <hr>
    <button onclick="resetAll()">↺ Начать заново</button>
  </div>
</div>

<script>
/* ---------- настройки ---------- */
const MSK = '+03:00';
const T = s => new Date(s + MSK);
const SYMP = {start:T('2026-10-09T13:30:00'), end:T('2026-10-09T16:00:00')}; // по ТЗ: до 16:00
const MK   = {start:T('2026-10-10T11:00:00'), end:T('2026-10-10T12:00:00')};
const MAX = 90, LV1 = 60, LV2 = 90;
const CODES = {anketa:['формула'], symp:['центрис'], mk:['nutilis','нутилис']};
const PIN = '1234';

const TIMES = [
  ['9.10, 10:00 — утро', '2026-10-09T10:00:00'],
  ['9.10, 13:00 — скоро симпозиум', '2026-10-09T13:00:00'],
  ['9.10, 14:10 — идёт симпозиум', '2026-10-09T14:10:00'],
  ['9.10, 16:30 — симпозиум закрыт', '2026-10-09T16:30:00'],
  ['10.10, 10:30 — скоро МК', '2026-10-10T10:30:00'],
  ['10.10, 11:20 — идёт МК', '2026-10-10T11:20:00'],
  ['10.10, 13:00 — МК закрыт', '2026-10-10T13:00:00'],
];
let simNow = T(TIMES[0][1]);
const now = () => simNow; // в приложении: new Date() или время сервера

/* ---------- состояние (в приложении — сохранять в браузере) ---------- */
let S;
function fresh(){
  return {screen:'welcome', pid: Math.random().toString(36).slice(2,6).toUpperCase(),
    done:{anketa:false,symp:false,quiz:false,taste:false,mk:false},
    formSent:false, quizSel:{}, quizWrong:false, stars:0, prize:null, msg:'', msgType:''};
}
S = fresh();
const PTS = {anketa:15,symp:30,quiz:15,taste:15,mk:15};
const score = () => Object.keys(S.done).reduce((a,k)=>a+(S.done[k]?PTS[k]:0),0);
const norm = s => s.trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'');

/* ---------- иконки ---------- */
const I = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 9h6M7 12h10"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
  cup:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M7 3h10l-1.5 17a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z"/><path d="M7.5 9h9M14 3l2-2"/></svg>',
  talk:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/></svg>',
};

/* ---------- время ---------- */
const DAYS = ['вс','пн','вт','ср','чт','пт','сб'];
function fmtLeft(ms){
  const m = Math.round(ms/60000), h = Math.floor(m/60), mm = m%60;
  return h ? `${h} ч ${mm} мин` : `${mm} мин`;
}
function win(w){
  const n = now();
  if (n < w.start) return {state:'soon', left:w.start-n};
  if (n <= w.end)  return {state:'live'};
  return {state:'closed'};
}

/* ---------- экраны ---------- */
function header(showScore){
  let h = '<div class="logo">логотип Nutridrink</div>';
  if (!showScore) return h;
  const sc = score();
  return h + `<div class="score">
    <div class="score-top"><span>Ваши баллы</span><span><b>${sc}</b> / ${MAX}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${sc/MAX*100}%"></div>
      <div class="mark" style="left:${LV1/MAX*100}%"></div><div class="mark-l" style="left:${LV1/MAX*100}%">60 · картхолдер</div>
      <div class="mark-l end" style="left:100%">90 · главный приз</div>
    </div></div><div style="height:10px"></div>`;
}

const screens = {
welcome: () => header(false) + `<div class="content">
  <p style="margin-top:20px">Уважаемый коллега!</p>
  <p>Команда <b>Nutricia</b> рада приветствовать вас на конгрессе «[название конгресса]».</p>
  <p>Вы точно знаете, что в процессе реабилитации после инсульта важна каждая деталь. Предлагаем сыграть в игру и собрать эффективную <b>«Формулу Восстановления»</b> для ваших пациентов.</p>
  <p style="margin-top:8px"><b>Как играть:</b></p>
  <ol>
    <li>выполняйте задания <b>9 и 10 октября в любом порядке</b></li>
    <li>за каждое задание получайте <b>баллы</b></li>
    <li><b>60 баллов</b> — картхолдер, <b>90 баллов</b> — главный приз</li>
    <li>каждый участник получит электронный <b>Справочник по продуктам Nutricia</b></li>
  </ol>
  <p>⭐ <b>Супер-задание</b> — 30 баллов, только 9 октября с 13:30.</p>
  <div class="spacer"></div>
  <button class="btn" onclick="go('anketa')">Начать</button></div>`,

anketa: () => header(true) + `<div class="content">
  <h2>Разминка: анкета · +15 баллов</h2>
  <p>Ответьте на несколько вопросов — после отправки вы увидите кодовое слово. Анкета открывает остальные задания.</p>
  <button class="btn primary" onclick="openForm()">Заполнить анкету</button>
  <p class="small" style="margin-top:14px">Кодовое слово из анкеты:</p>
  <input class="input" id="code" placeholder="Введите кодовое слово" autocomplete="off">
  <div class="msg ${S.msgType}">${S.msg}</div>
  <div class="spacer"></div>
  <button class="btn" onclick="checkCode('anketa')">Далее</button></div>`,

hub: () => {
  const sw = win(SYMP), mw = win(MK);
  let symSt, symCls = 'card gold';
  if (S.done.symp) { symSt = '✓ Выполнено · +30'; }
  else if (sw.state==='soon') symSt = sw.left > 864e5 ? '9 октября (пт) · 13:30–15:00 · зал «[уточнить]»' : `⏳ Начнётся через ${fmtLeft(sw.left)} · зал «[уточнить]»`;
  else if (sw.state==='live') { symSt = '🔴 Идёт сейчас · кодовое слово на финальном слайде'; symCls += ' live'; }
  else { symSt = 'Время вышло'; symCls += ' closed'; }

  let mkSt, mkCls = 'card silver';
  if (S.done.mk) { mkSt = '✓ +15'; mkCls += ' done'; }
  else if (mw.state==='soon') mkSt = mw.left > 864e5 ? '10.10 в 11:00' : `⏳ через ${fmtLeft(mw.left)}`;
  else if (mw.state==='live') { mkSt = '🔴 Идёт сейчас'; mkCls += ' live'; }
  else { mkSt = 'Время вышло'; mkCls += ' closed'; }

  const c = (k,cls,ico,title,st,tag='') => `<button class="${cls}${S.done[k]&&!cls.includes('done')&&!cls.includes('gold')?' done':''}" onclick="go('${k}')">
    <span class="pts">${S.done[k]?'✓ ':'+'}${PTS[k]}</span>
    ${tag?`<span class="tag">${tag}</span>`:''}
    <span class="ico">${ico}</span><span class="t">${title}</span><span class="st">${st}</span></button>`;

  const sc = score();
  const prize = S.prize ? `<div class="prizebox">${I.gift}<div><b>Приз получен</b><div class="small">${S.prize}</div></div></div>`
    : sc >= LV1 ? `<button class="btn primary" onclick="go('prize')">🎁 Получить приз</button>`
    : `<div class="prizebox">${I.gift}<div><b>До картхолдера — ${LV1-sc} баллов</b><div class="small">Выполняйте задания в любом порядке</div></div></div>`;

  return header(true) + `<div class="content">
    <div class="grid">
      ${c('symp',symCls,I.mic,'Посетите симпозиум Nutricia',symSt,'★ СУПЕР-ЗАДАНИЕ')}
      ${c('quiz','card',I.quiz,'Квиз о продуктах', S.done.quiz?'Выполнено':'Подсказки — на стенде')}
      ${c('taste','card',I.cup,'Отзыв о дегустации', S.done.taste?'Выполнено':'Стенд Nutricia')}
      ${c('mk',mkCls,I.talk,'Мастер-класс логопедов',mkSt,'10 ОКТЯБРЯ')}
      <div class="card" style="cursor:default;background:transparent;border:1.5px dashed #c9b6d4;justify-content:center;align-items:center;text-align:center">
        <span class="small">Место для доп. задания<br>(робособака, ролик)</span></div>
    </div>
    ${prize}
    <div class="pid">ID участника: ${S.pid}</div></div>`;
},

symp: () => {
  const w = win(SYMP);
  let body;
  if (S.done.symp) body = `<p class="msg ok">✓ Супер-задание выполнено! +30 баллов</p>`;
  else if (w.state==='closed') body = `<p>К сожалению, симпозиум уже завершился, но вы можете узнать больше о нутритивной поддержке на стенде Nutricia.</p>`;
  else body = `
    ${w.state==='soon' ? `<p><b>⏳ Начнётся через ${fmtLeft(w.left)}</b></p><p class="small">Поле для слова откроется в 13:30.</p>`
      : `<p><b>🔴 Симпозиум идёт.</b> Кодовое слово появится на одном из финальных слайдов.</p>`}
    <input class="input" id="code" placeholder="Кодовое слово с симпозиума" ${w.state==='soon'?'disabled':''} autocomplete="off">
    <div class="msg ${S.msgType}">${S.msg}</div>`;
  return header(true) + `<div class="content">
    <button class="back" onclick="go('hub')">← Все задания</button>
    <div class="hero gold">
      <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#7a4f00">★ СУПЕР-ЗАДАНИЕ · +30 БАЛЛОВ</div>
      <h2>Нутритивная терапия как базис успешной реабилитации после инсульта: от клинических рекомендаций к экономической эффективности</h2>
      <p style="margin:0">9 октября (пт) · <b>13:30–15:00</b> · зал «[уточнить]»</p>
    </div>
    ${body}
    <div class="spacer"></div>
    ${(!S.done.symp && w.state==='live') ? `<button class="btn" onclick="checkCode('symp')">Получить баллы</button>` : `<button class="btn" onclick="go('hub')">К заданиям</button>`}
  </div>`;
},

quiz: () => {
  const Q = [
    ['Сколько белка в 1 упаковке Нутридринк 200 мл?', ['6 г','12 г','20 г'], 1],
    ['Какова энергетическая ценность 1 упаковки?', ['150 ккал','200 ккал','300 ккал'], 2],
    ['Сколько витаминов в 1 упаковке?', ['5','13','20'], 1],
  ];
  window._Q = Q;
  if (S.done.quiz) return header(true) + `<div class="content"><button class="back" onclick="go('hub')">← Все задания</button>
    <p class="msg ok">✓ Квиз пройден! +15 баллов</p><div class="spacer"></div><button class="btn" onclick="go('hub')">К заданиям</button></div>`;
  return header(true) + `<div class="content">
    <button class="back" onclick="go('hub')">← Все задания</button>
    <h2>Время квиза! · +15 баллов</h2>
    <p class="small">Подсказки — на стенде Nutricia в выставочной зоне. Эксперты помогут.</p>
    ${Q.map((q,i)=>`<div class="q"><div class="qt">${i+1}. ${q[0]}</div>
      ${q[1].map((o,j)=>`<button class="opt ${S.quizSel[i]===j?'sel':''} ${S.quizWrong&&S.quizSel[i]===j&&j!==q[2]?'wrong':''}" onclick="pick(${i},${j})">${o}</button>`).join('')}</div>`).join('')}
    <div class="msg ${S.msgType}">${S.msg}</div>
    <p class="small">Вопросы — пример, формулировки согласовать с медицинским отделом.</p>
    <div class="spacer"></div>
    <button class="btn" onclick="checkQuiz()">Проверить</button></div>`;
},

taste: () => {
  if (S.done.taste) return header(true) + `<div class="content"><button class="back" onclick="go('hub')">← Все задания</button>
    <p class="msg ok">✓ Спасибо за отзыв! +15 баллов</p><div class="spacer"></div><button class="btn" onclick="go('hub')">К заданиям</button></div>`;
  return header(true) + `<div class="content">
    <button class="back" onclick="go('hub')">← Все задания</button>
    <h2>Отзыв о дегустации · +15 баллов</h2>
    <p>Продегустируйте продукты на стенде Nutricia и поделитесь впечатлениями.</p>
    <p class="small">Оценка вкуса</p>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button class="${S.stars>=n?'on':''}" onclick="S.stars=${n};render()">★</button>`).join('')}</div>
    <textarea class="input" id="rev" placeholder="Несколько слов о ваших впечатлениях">${S.rev||''}</textarea>
    <div class="msg ${S.msgType}">${S.msg}</div>
    <div class="spacer"></div>
    <button class="btn" onclick="sendReview()">Отправить отзыв</button></div>`;
},

mk: () => {
  const w = win(MK);
  let body;
  if (S.done.mk) body = `<p class="msg ok">✓ Задание выполнено! +15 баллов</p>`;
  else if (w.state==='closed') body = `<p>К сожалению, мастер-класс уже завершился, но вы можете узнать больше о коррекции дисфагии на стенде Nutricia.</p>`;
  else body = `${w.state==='soon' ? `<p><b>⏳ Начнётся через ${fmtLeft(w.left)}</b></p><p class="small">Поле для слова откроется в 11:00.</p>`
      : `<p><b>🔴 Мастер-класс идёт.</b> Кодовое слово — на экране стенда.</p>`}
    <input class="input" id="code" placeholder="Кодовое слово" ${w.state==='soon'?'disabled':''} autocomplete="off">
    <div class="msg ${S.msgType}">${S.msg}</div>`;
  return header(true) + `<div class="content">
    <button class="back" onclick="go('hub')">← Все задания</button>
    <div class="hero silver">
      <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#55566a">10 ОКТЯБРЯ · +15 БАЛЛОВ</div>
      <h2>Мастер-класс логопедов</h2>
      <p style="margin:0">Стенд Nutricia · <b>11:00</b> · коррекция дисфагии</p>
    </div>
    ${body}
    <div class="spacer"></div>
    ${(!S.done.mk && w.state==='live') ? `<button class="btn" onclick="checkCode('mk')">Получить баллы</button>` : `<button class="btn" onclick="go('hub')">К заданиям</button>`}
  </div>`;
},

prize: () => {
  const sc = score(), lvl = sc >= LV2 ? 'Главный приз' : 'Картхолдер';
  const hint = sc < LV2 ? `<p class="small">Приз выдаётся один раз. До главного приза — ${LV2-sc} баллов: можно выполнить оставшиеся задания и вернуться.</p>` : '';
  return header(true) + `<div class="content">
    <button class="back" onclick="go('hub')">← Все задания</button>
    <h2>Поздравляем!</h2>
    <p>Вы набрали <b>${sc} баллов</b>. Ваш приз: <b>${lvl}</b>.</p>
    <p>Покажите этот экран сотруднику на стенде Nutricia.</p>
    <p>Ссылка на электронный <b>Справочник по продуктам Nutricia</b> придёт на email из анкеты.</p>
    ${hint}
    <p class="small" style="margin-top:10px">Для сотрудника:</p>
    <input class="input" id="pin" type="password" inputmode="numeric" placeholder="PIN сотрудника">
    <div class="msg ${S.msgType}">${S.msg}</div>
    <div class="spacer"></div>
    <button class="btn primary" onclick="givePrize('${lvl}')">Приз выдан</button></div>`;
},
};

/* ---------- действия ---------- */
function go(s){
  if (s !== 'anketa' && s !== 'welcome' && !S.done.anketa) s = 'anketa';
  S.screen = s; S.msg=''; S.msgType=''; S.quizWrong=false; render();
}
function say(t,type){ S.msg=t; S.msgType=type; }
function toast(t){
  const el = document.createElement('div'); el.className='toast'; el.textContent=t;
  document.getElementById('phone').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),300)},1600);
}
function checkCode(k){
  const v = norm(document.getElementById('code')?.value || '');
  if (!v) { say('Введите кодовое слово','err'); return render(); }
  if (k==='symp' && win(SYMP).state!=='live') return render();
  if (k==='mk' && win(MK).state!=='live') return render();
  if (CODES[k].includes(v)) {
    S.done[k] = true; toast(`+${PTS[k]} баллов`);
    return go(k==='anketa' ? 'hub' : k);
  }
  say('Слово не подошло. Проверьте написание и попробуйте ещё раз.','err'); render();
}
function openForm(){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="sheet"><b>Яндекс Форма (iframe)</b>
    <div class="mock-form">forms.yandex.ru/cloud/6aabe…?iframe=1&amp;<b>pid=${S.pid}</b><br><br>ФИО · Специальность · Город · Email · Согласие на обработку ПД<br><br>
    <span id="formRes"></span></div>
    <button class="btn primary" id="fs">Отправить</button>
    <button class="btn link" id="fc">Закрыть</button></div>`;
  document.getElementById('phone').appendChild(m);
  m.querySelector('#fs').onclick = () => { m.querySelector('#formRes').innerHTML = 'Спасибо! Ваше кодовое слово: <b>ФОРМУЛА</b>'; m.querySelector('#fs').style.display='none'; };
  m.querySelector('#fc').onclick = () => m.remove();
}
function pick(i,j){ S.quizSel[i]=j; S.quizWrong=false; say('',''); render(); }
function checkQuiz(){
  const Q = window._Q;
  if (Object.keys(S.quizSel).length < Q.length) { say('Ответьте на все вопросы','err'); return render(); }
  const ok = Q.every((q,i)=>S.quizSel[i]===q[2]);
  if (ok) { S.done.quiz = true; toast('+15 баллов'); return go('quiz'); }
  S.quizWrong = true; say('Есть неточность. Загляните на стенд Nutricia — подсказки на панелях — и попробуйте ещё раз.','err'); render();
}
function sendReview(){
  const t = document.getElementById('rev').value.trim(); S.rev = t;
  if (t.length < 3) { say('Напишите несколько слов о впечатлениях','err'); return render(); }
  S.done.taste = true; toast('+15 баллов'); go('taste');
}
function givePrize(lvl){
  if (document.getElementById('pin').value !== PIN) { say('Неверный PIN','err'); return render(); }
  S.prize = `${lvl} · выдан ${now().toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}`;
  go('hub');
}
function resetAll(){ S = fresh(); render(); }

/* ---------- отрисовка ---------- */
function render(){
  const keep = document.getElementById('code')?.value;
  document.getElementById('phone').innerHTML = screens[S.screen]();
  if (keep && document.getElementById('code') && S.msgType==='err') document.getElementById('code').value = keep;
  document.getElementById('timeBtns').innerHTML = TIMES.map(([l,t])=>
    `<button class="${+T(t)===+simNow?'cur':''}" onclick="simNow=T('${t}');render()">${l}</button>`).join('');
  document.getElementById('nowLbl').textContent = 'Сейчас (МСК): ' + simNow.toLocaleString('ru-RU',{timeZone:'Europe/Moscow',weekday:'short',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
}
render();
</script>
</body>
</html>
